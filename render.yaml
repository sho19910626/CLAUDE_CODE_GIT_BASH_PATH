# Render (https://render.com) にデプロイするための設定。
#
# サーバーレスではなく常駐サーバーとして動かす。提案の生成に2〜4分かかり、
# サーバーレスの実行時間制限に引っかかるため。
#
# ダッシュボードで Blueprint として読み込むと、この内容で作成される。
# 環境変数は sync:false にしてあるので、値は画面から入力する(リポジトリには残らない)。

services:
  - type: web
    name: recruit-studio
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /indeed
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Anthropic APIキー(必須)
      - key: ANTHROPIC_API_KEY
        sync: false
      # 入口のパスワード(必須)。未設定だと誰でもアクセスできてしまう
      - key: BASIC_AUTH_USER
        sync: false
      - key: BASIC_AUTH_PASSWORD
        sync: false
      # 画像生成を使う場合のみ(任意)
      - key: OPENAI_API_KEY
        sync: false
